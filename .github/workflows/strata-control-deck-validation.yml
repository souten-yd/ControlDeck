name: Validate Strata and ControlDeck changes

# Additional focused tests are manually requested only when required.
# The normal review-ready PR workflow already covers the full test suite.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Syntax check changed backend modules
        run: python -m compileall -q backend/app
      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_gpu_runtime_addon.py backend/tests/test_local_llm_gateway.py backend/tests/test_llm_gateway.py backend/tests/test_runtime_policy.py backend/tests/test_runtime_provider.py backend/tests/test_features.py backend/tests/test_strata_gateway.py backend/tests/test_control_deck_self_update.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build and typecheck
        run: npm run build --prefix frontend
