name: Strata / runtime / updater checks

on:
  # Cloud CI is paid. NEVER trigger on push / PR automatically.
  # Run only after local validation on the owner's PC and only when essential.
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which check needs GitHub-hosted verification?'
        required: true
        default: backend
        type: choice
        options:
          - backend
          - frontend
          - both

permissions:
  contents: read

jobs:
  backend:
    if: inputs.scope == 'backend' || inputs.scope == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/tests
      - name: Focused regression tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_strata_runtime.py \
            tests/test_gpu_runtime_addon.py \
            tests/test_local_llm_gateway.py \
            tests/test_platform_update.py \
            tests/test_runtime_policy.py \
            tests/test_llm_gateway.py \
            tests/test_gpu_release.py
      - name: Full backend regression suite
        working-directory: backend
        run: python -m pytest -q

  frontend:
    if: inputs.scope == 'frontend' || inputs.scope == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: TypeScript and production build
        working-directory: frontend
        run: npm run build
