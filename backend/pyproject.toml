[project]
name = "control-deck"
version = "0.1.0"
description = "Ubuntu Control Deck — self-hosted web control center for Ubuntu"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "anyio>=4.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "packaging>=24.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 通ったテストの一時フォルダは残さない（2026-11-21: 90GB の見かけの GGUF を作るテストが残した分で、
# 箱の /tmp が見かけ 372GB になった）。失敗したテストの分だけ調べるために残す
tmp_path_retention_policy = "failed"
